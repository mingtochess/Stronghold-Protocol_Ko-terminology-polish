<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우르수스 로컬 실험</title><link rel="icon" href="data:,">
<style>body{margin:0;background:#101819;color:#e5eeee;font:15px system-ui}header{padding:18px 24px;background:#1b282a}h1{font-size:24px;margin:0 0 10px}button,select,input{font:inherit;padding:8px;background:#293b3e;color:white;border:1px solid #789;border-radius:6px}a{color:#66dfc1}main{padding:16px 24px}#field{height:400px;background:#182526;border-radius:12px}#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#213034;padding:12px;border-radius:8px}.card img{width:100%;height:120px;object-fit:contain;background:#fff}.card h3{margin:8px 0}.card p{font-size:13px;line-height:1.6}#stats{white-space:pre-wrap;line-height:1.8}label{display:inline-block;margin:5px 12px 5px 0}#error{color:#ffb5b5}</style>
<header><h1>우르수스 로컬 실험</h1><div>오퍼레이터·스킬·중첩을 선택해 실제 전투를 시험합니다. 정식 사이트에는 반영되지 않습니다. <a href="/">게임 로비 열기</a></div></header>
<main><label>우르수스 수 <select id="count"><option>2</option><option selected>3</option><option>5</option><option>6</option><option>10</option></select></label><label>중첩 <input id="layers" type="number" min="0" max="999" value="0" style="width:80px"></label><label><input id="elite" type="checkbox"> 정예</label><button id="restart">다시 시작</button><button id="charge">전체 스킬 충전·발동</button><button id="injure">아군 HP 50%</button><label><input id="combat" type="checkbox" checked> 훈련 표적</label><p id="error"></p><div id="field"></div><pre id="stats"></pre><h2>오퍼레이터 · 특질</h2><p>각 카드에서 참가 여부와 스킬을 선택한 뒤 다시 시작하세요. 체크된 인원이 상단 인원 제한보다 많으면 앞에서부터 배치합니다.</p><p><img src="/assets/custom/ursus/item/ursus-cutlass.png" width="48" style="vertical-align:middle"> 우르수스 곡도: 공격력·최대 HP +15% / 정예 +25%. 변형 구조체와 함께 장착하면 우르수스 소속을 부여합니다.</p><div id="roster"></div></main>
<script type="module" src="/dev/ursus.js"></script></html>
